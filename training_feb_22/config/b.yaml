# ============================================================================
# A02_tokenlevel_gliner_multi_pii_v1_domain.yaml
# Token-level fine-tune from an existing PII-specialized GLiNER checkpoint.
# ============================================================================

run:
  name: "b-gliner-pii-token-multipii-v1-spam-v1"
  description: "Domain adaptation for PII-in-spam using token-level GLiNER starting from gliner_multi_pii-v1."
  tags: ["pii", "spam", "gliner", "token_level", "domain-adapt", "multipii-v1"]
  seed: 42

model:
  model_name: "microsoft/deberta-v3-base"  # fallback only
  name: "gliner-pii-token-multipii-v1-spam"

  labels_encoder: null
  labels_decoder: null
  decoder_mode: null
  full_decoder_context: true
  blank_entity_prob: 0.1
  decoder_loss_coef: 0.5

  relations_layer: null
  triples_layer: null
  embed_rel_token: true
  rel_token_index: -1
  rel_token: "<<REL>>"
  adjacency_loss_coef: 1.0
  relation_loss_coef: 1.0

  span_mode: "token_level"
  max_width: 12                 # ignored in token_level, keep default-ish
  represent_spans: false
  neg_spans_ratio: 1.0

  hidden_size: 768
  dropout: 0.25

  fine_tune: true
  subtoken_pooling: "first"

  fuse_layers: false
  post_fusion_schema: ""
  num_post_fusion_layers: 1

  num_rnn_layers: 0             # token_level often works fine without LSTM

  max_len: 1024                 # for long spam, but confirm backbone supports it
  max_types: 100
  max_neg_type_ratio: 2
  words_splitter_type: "whitespace"

  embed_ent_token: true
  class_token_index: -1         # CRITICAL
  ent_token: "<<ENT>>"
  sep_token: "<<SEP>>"
  vocab_size: -1                # CRITICAL

  token_loss_coef: 1.0
  span_loss_coef: 1.0

  encoder_config: null
  _attn_implementation: null

data:
  root_dir: "gliner_logs/gliner-pii-token-multipii-v1-spam-v1"
  train_data: "data/merged/pii_spam_mix_token_train.json"
  val_data_dir: "data/merged/pii_spam_mix_token_val.json"

training:
  prev_path: "urchade/gliner_multi_pii-v1"

  num_steps: 12000
  scheduler_type: "cosine"
  warmup_ratio: 0.05

  train_batch_size: 48
  eval_batch_size: 64
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0

  optimizer: "adamw_torch"
  # domain adaptation -> conservative encoder LR, slightly higher head LR
  lr_encoder: 8.0e-6
  lr_others: 4.0e-5
  weight_decay_encoder: 0.01
  weight_decay_other: 0.01

  loss_alpha: 0.75
  loss_gamma: 2.0
  loss_prob_margin: 0.0
  label_smoothing: 0.0
  loss_reduction: "sum"

  # push “say no” harder in fixed-label settings
  negatives: 2.0
  masking: "none"

  eval_every: 1000
  save_total_limit: 6
  logging_steps: 50

  bf16: true
  fp16: false
  use_cpu: false

  dataloader_num_workers: 6
  dataloader_pin_memory: true
  dataloader_persistent_workers: false
  dataloader_prefetch_factor: 2

  freeze_components: null
  compile_model: false

lora:
  enabled: false
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules: ["all-linear"]
  task_type: "TOKEN_CLS"
  modules_to_save: null

environment:
  push_to_hub: true
  hub_model_id: "YOUR_ORG/gliner-pii-token-multipii-v1-spam-v1"
  hf_token: null

  report_to: "wandb"
  wandb_project: "gliner-pii"
  wandb_entity: null
  wandb_api_key: null

  cuda_visible_devices: "0"