# ============================================================================
# A04_longcontext_mmbert_tokenlevel_from_config.yaml
# Build GLiNER from config on a long-context backbone, token-level for efficiency.
# ============================================================================

run:
  name: "d-gliner-pii-long-mmbert-tokenlevel-v1"
  description: "Long-context PII detection for long spam using mmBERT-base backbone + token_level GLiNER."
  tags: ["pii", "spam", "long-context", "mmbert", "token_level", "from_config"]
  seed: 42

model:
  model_name: "jhu-clsp/mmBERT-base"
  name: "gliner-pii-long-mmbert-tokenlevel"

  labels_encoder: null
  labels_decoder: null
  decoder_mode: null
  full_decoder_context: true
  blank_entity_prob: 0.1
  decoder_loss_coef: 0.5

  relations_layer: null
  triples_layer: null
  embed_rel_token: true
  rel_token_index: -1
  rel_token: "<<REL>>"
  adjacency_loss_coef: 1.0
  relation_loss_coef: 1.0

  span_mode: "token_level"
  max_width: 12
  represent_spans: false
  neg_spans_ratio: 1.0

  hidden_size: 768
  dropout: 0.30

  fine_tune: true
  subtoken_pooling: "first"

  fuse_layers: false
  post_fusion_schema: ""
  num_post_fusion_layers: 1

  num_rnn_layers: 0

  # You can push this higher (2048/4096) if the backbone + memory allow.
  max_len: 2048
  max_types: 100
  max_neg_type_ratio: 2
  words_splitter_type: "whitespace"

  embed_ent_token: true
  class_token_index: -1
  ent_token: "<<ENT>>"
  sep_token: "<<SEP>>"
  vocab_size: -1

  token_loss_coef: 1.0
  span_loss_coef: 1.0

  encoder_config: null
  _attn_implementation: null

data:
  root_dir: "gliner_logs/gliner-pii-long-mmbert-tokenlevel-v1"
  train_data: "data/merged/pii_spam_longpacked_train.json"
  val_data_dir: "data/merged/pii_spam_longpacked_val.json"

training:
  prev_path: null  # build from config

  num_steps: 40000
  scheduler_type: "cosine"
  warmup_ratio: 0.05

  train_batch_size: 12
  eval_batch_size: 16
  gradient_accumulation_steps: 2
  max_grad_norm: 1.0

  optimizer: "adamw_torch"
  lr_encoder: 1.0e-5
  lr_others: 5.0e-5
  weight_decay_encoder: 0.01
  weight_decay_other: 0.01

  loss_alpha: 0.75
  loss_gamma: 2.0
  loss_prob_margin: 0.0
  label_smoothing: 0.0
  loss_reduction: "sum"

  negatives: 2.0
  masking: "none"

  eval_every: 2000
  save_total_limit: 8
  logging_steps: 50

  bf16: true
  fp16: false
  use_cpu: false

  dataloader_num_workers: 6
  dataloader_pin_memory: true
  dataloader_persistent_workers: false
  dataloader_prefetch_factor: 2

  freeze_components: null
  compile_model: false

lora:
  enabled: false
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules: ["all-linear"]
  task_type: "TOKEN_CLS"
  modules_to_save: null

environment:
  push_to_hub: true
  hub_model_id: "YOUR_ORG/gliner-pii-long-mmbert-tokenlevel-v1"
  hf_token: null

  report_to: "wandb"
  wandb_project: "gliner-pii"
  wandb_entity: null
  wandb_api_key: null

  cuda_visible_devices: "0"