# ============================================================================
# A03_biencoder_token_gliner_bi_edge_v2.yaml
# Bi-encoder GLiNER for long contexts & strong negative label pressure.
# ============================================================================

run:
  name: "c-gliner-pii-biencoder-bi-edge-v2-longspam-v1"
  description: "PII in long spam using bi-encoder GLiNER (separate label encoder); great for many labels + hard negatives."
  tags: ["pii", "spam", "gliner", "bi-encoder", "long-context", "bi-edge-v2"]
  seed: 42

model:
  # Documentary fallback only; actual is loaded from prev_path (bi-edge config).
  model_name: "jhu-clsp/ettin-encoder-32m"
  name: "gliner-pii-biencoder-bi-edge-v2"

  # Bi-edge uses a separate labels encoder (per its model config).
  labels_encoder: "sentence-transformers/all-MiniLM-L6-v2"
  labels_decoder: null
  decoder_mode: null
  full_decoder_context: true
  blank_entity_prob: 0.1
  decoder_loss_coef: 0.5

  relations_layer: null
  triples_layer: null
  embed_rel_token: true
  rel_token_index: -1
  rel_token: "<<REL>>"
  adjacency_loss_coef: 1.0
  relation_loss_coef: 1.0

  # bi-edge is published as span_mode markerV0 in its config; but you can still
  # choose token_level in your own derived run if you rebuild-from-config.
  span_mode: "markerV0"
  max_width: 12
  represent_spans: false
  neg_spans_ratio: 1.0

  hidden_size: 384
  dropout: 0.35

  fine_tune: true
  subtoken_pooling: "first"

  fuse_layers: false
  post_fusion_schema: ""
  num_post_fusion_layers: 1

  num_rnn_layers: 1

  max_len: 2048
  max_types: 100
  max_neg_type_ratio: 2
  words_splitter_type: "whitespace"

  embed_ent_token: true
  class_token_index: -1
  ent_token: "<<ENT>>"
  sep_token: "<<SEP>>"
  vocab_size: -1

  token_loss_coef: 1.0
  span_loss_coef: 1.0

  encoder_config: null
  _attn_implementation: null

data:
  root_dir: "gliner_logs/gliner-pii-biencoder-bi-edge-v2-longspam-v1"
  train_data: "data/merged/pii_spam_mix_long_train.json"
  val_data_dir: "data/merged/pii_spam_mix_long_val.json"

training:
  prev_path: "knowledgator/gliner-bi-edge-v2.0"

  num_steps: 20000
  scheduler_type: "cosine"
  warmup_ratio: 0.05

  train_batch_size: 24
  eval_batch_size: 32
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0

  optimizer: "adamw_torch"
  lr_encoder: 1.0e-5
  lr_others: 3.0e-5
  weight_decay_encoder: 0.01
  weight_decay_other: 0.01

  # mirror bi-edge’s focal defaults
  loss_alpha: 0.70
  loss_gamma: 2.0
  loss_prob_margin: 0.0
  label_smoothing: 0.0
  loss_reduction: "sum"

  negatives: 2.0
  masking: "none"

  eval_every: 1000
  save_total_limit: 6
  logging_steps: 50

  bf16: true
  fp16: false
  use_cpu: false

  dataloader_num_workers: 6
  dataloader_pin_memory: true
  dataloader_persistent_workers: false
  dataloader_prefetch_factor: 2

  # If you *only* want to adapt label encoder + head and keep text encoder fixed:
  # freeze_components: ["text_encoder"]
  freeze_components: null
  compile_model: false

lora:
  enabled: false
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules: ["all-linear"]
  task_type: "TOKEN_CLS"
  modules_to_save: null

environment:
  push_to_hub: true
  hub_model_id: "YOUR_ORG/gliner-pii-biencoder-bi-edge-v2-longspam-v1"
  hf_token: null

  report_to: "wandb"
  wandb_project: "gliner-pii"
  wandb_entity: null
  wandb_api_key: null

  cuda_visible_devices: "0"